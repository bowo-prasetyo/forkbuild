<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- App Background -->
  <rect width="64" height="64" rx="14" fill="#121212"/>
  
  <!-- Isometric "Build" Block -->
  <!-- Top Face -->
  <polygon points="32,12 54,24 32,36 10,24" fill="#5fc490"/>
  <!-- Left Face -->
  <polygon points="10,24 32,36 32,56 10,44" fill="#388e5c"/>
  <!-- Right Face -->
  <polygon points="54,24 32,36 32,56 54,44" fill="#4caf7d"/>
  
  <!-- "Fork" Symbol embedded in the top face (Isometric projection) -->
  <path d="M32 33 L32 24 M32 24 L20 17 M32 24 L44 17" 
        stroke="#121212" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        
  <!-- Branch Nodes -->
  <circle cx="32" cy="33" r="2.5" fill="#121212"/>
  <circle cx="20" cy="17" r="2.5" fill="#121212"/>
  <circle cx="44" cy="17" r="2.5" fill="#121212"/>
</svg>
