<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ForkBuild itch.io wide cover</title>
<!-- The itch.io wide cover, 1260 × 540 (21:9, for itch's home page
     featuring), photographed by scripts/press-kit.mjs as
     docs/launch/press/itch-wide-cover.png: the logo, name and the fantasy on
     a paper panel, beside the castle at its own size, uncropped. Colours are
     css/main/theme.css's. -->
<style>
  html, body { margin: 0; width: 1260px; height: 540px; overflow: hidden; }
  body {
    position: relative; background: #f6efe2;
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #2e261c;
  }
  .shot {
    position: absolute; top: 0; right: 0; width: 790px; height: 540px;
    background: url("../press/editor-castle.png") -367px -220px / 1280px 800px no-repeat;
  }
  /* The panel's edge fades into the shot rather than cutting it. */
  .shot::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 120px;
    background: linear-gradient(to right, #f6efe2, rgb(246 239 226 / 0));
  }
  .panel {
    position: absolute; top: 0; bottom: 0; left: 0; width: 520px; box-sizing: border-box;
    padding: 0 40px 0 56px; display: flex; flex-direction: column; justify-content: center;
  }
  .name { display: flex; align-items: center; gap: 18px; }
  .name img { width: 96px; height: 96px; }
  h1 { margin: 0; font-size: 64px; letter-spacing: -1px; color: #211a12; }
  p { margin: 26px 0 0; font-size: 30px; line-height: 1.25; font-weight: 600; }
  .facts {
    margin-top: 26px; align-self: flex-start; padding: 8px 16px; border-radius: 999px;
    background: #e2f0e5; color: #2b6e45; font-size: 19px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="shot"></div>
  <div class="panel">
    <div class="name">
      <img src="../../../assets/icons/logo.svg" alt="">
      <h1>ForkBuild</h1>
    </div>
    <p>Build a little place. Anyone can remix it. Walk inside it with friends.</p>
    <span class="facts">Free · In your browser · No account</span>
  </div>
</body>
</html>
