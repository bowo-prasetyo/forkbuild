<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ForkBuild itch.io cover</title>
<!-- The itch.io cover image, 630 × 500, photographed by scripts/press-kit.mjs
     as docs/launch/press/itch-cover.png: the castle, with the logo, name and
     tagline on a paper band. Colours are css/main/theme.css's. -->
<style>
  html, body { margin: 0; width: 630px; height: 500px; overflow: hidden; }
  body {
    position: relative; background: #f6efe2 url("../press/editor-castle.png") -399px -175px / 1200px auto no-repeat;
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #2e261c;
  }
  .band {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 24px;
    display: flex; align-items: center; gap: 16px;
    background: rgb(246 239 226 / 0.96); border-top: 2px solid #dccaa7;
  }
  .band img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 40px; letter-spacing: -0.5px; }
  p { margin: 2px 0 0; font-size: 18px; color: #4a3f31; }
</style>
</head>
<body>
  <div class="band">
    <img src="../../../assets/icons/logo.svg" alt="">
    <div>
      <h1>ForkBuild</h1>
      <p>Build in 3D in your browser. Remix anything.</p>
    </div>
  </div>
</body>
</html>
