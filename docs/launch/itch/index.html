<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForkBuild</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1d2a22, #121212 70%);
    color: #e6e6e6; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
  }
  main { padding: 24px; max-width: 34rem; }
  h1 { margin: 0 0 8px; font-size: 2.4rem; color: #fff; }
  p { margin: 0 0 24px; color: #c8c8c8; }
  a.play {
    display: inline-block; padding: 14px 28px; border-radius: 10px;
    background: #4caf7d; color: #0d1a12; font-weight: 700; font-size: 1.15rem; text-decoration: none;
  }
  a.play:hover, a.play:focus-visible { background: #5fc490; }
  small { display: block; margin-top: 20px; color: #9a9a9a; }
</style>
</head>
<body>
<main>
  <h1>ForkBuild</h1>
  <p>Build in 3D in your browser. Snap bricks into castles and villages, remix anyone's build, and share it as a link.</p>
  <a class="play" href="https://bowo-prasetyo.github.io/forkbuild/?ref=itch" target="_blank" rel="noopener">Play ForkBuild</a>
  <small>Opens in a new tab. Free, open source, no account.</small>
</main>
</body>
</html>
